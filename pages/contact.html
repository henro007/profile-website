<main>
<div class="page">
  <h2>Contact Me</h2>
  <form id="contact-form" novalidate>
    <div><input id="name" placeholder="Your name"><div class="error" id="name-err"></div></div>
    <div><input id="email" type="email" placeholder="Your email"><div class="error" id="email-err"></div></div>
    <div><textarea id="message" rows="5" placeholder="Your message"></textarea><div class="error" id="message-err"></div></div>
    <button class="btn" type="submit">Send</button>
    <div id="form-msg"></div>
  </form>
</div>
</main>
